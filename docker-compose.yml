services:
  mysql:
    image: mysql:8.0
    container_name: ero-erp-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: RootSecurePassword_2026!
      MYSQL_DATABASE: ero_erp_db
      MYSQL_USER: erp_admin
      MYSQL_PASSWORD: SecurePassword_2026!
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci --sql-mode="STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./apps/api/src/db/ddl:/docker-entrypoint-initdb.d
    networks:
      - erp-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "erp_admin", "-pSecurePassword_2026!" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ero-erp-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - erp-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: ero-erp-api
    restart: always
    environment:
      - NODE_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=erp_admin
      - DB_PASSWORD=SecurePassword_2026!
      - DB_NAME=ero_erp_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - erp-network

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    container_name: ero-erp-web
    restart: always
    depends_on:
      - api
    networks:
      - erp-network

  nginx:
    image: nginx:alpine
    container_name: ero-erp-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
    networks:
      - erp-network

volumes:
  mysql_data:
  redis_data:

networks:
  erp-network:
    driver: bridge

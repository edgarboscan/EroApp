<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="eroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#007BFF" />
      <stop offset="100%" stop-color="#0044CC" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#1C2541" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle glow layer -->
  <circle cx="256" cy="256" r="160" fill="url(#eroGrad)" opacity="0.15" filter="blur(30px)" />

  <!-- Geometric Isotype 'E' with Business Nodes -->
  <g transform="translate(106, 106)">
    <!-- Vertical Backbone -->
    <rect x="20" y="30" width="48" height="240" rx="24" fill="url(#eroGrad)" />

    <!-- Top Arm with Node -->
    <rect x="44" y="30" width="170" height="48" rx="24" fill="url(#eroGrad)" />
    <circle cx="214" cy="54" r="28" fill="url(#glowGrad)" />
    <circle cx="214" cy="54" r="14" fill="#FFFFFF" />

    <!-- Middle Arm with Connected Flow -->
    <rect x="44" y="126" width="130" height="48" rx="24" fill="url(#eroGrad)" />
    <circle cx="174" cy="150" r="22" fill="url(#glowGrad)" />
    <circle cx="174" cy="150" r="10" fill="#FFFFFF" />

    <!-- Bottom Arm with Enterprise Node -->
    <rect x="44" y="222" width="190" height="48" rx="24" fill="url(#eroGrad)" />
    <circle cx="234" cy="246" r="28" fill="url(#glowGrad)" />
    <circle cx="234" cy="246" r="14" fill="#FFFFFF" />

    <!-- Connected Data Lines / Flow Dots -->
    <path d="M 214 82 L 214 110 L 174 126" stroke="#00D2FF" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 8" opacity="0.8" fill="none" />
    <path d="M 174 174 L 174 200 L 234 220" stroke="#00D2FF" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 8" opacity="0.8" fill="none" />
  </g>
</svg>

